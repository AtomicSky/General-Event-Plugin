plugins { id 'java'; id 'com.gradleup.shadow' version '9.6.1' }
group = 'dev.gep'
version = '1.1.1'
repositories {
    mavenCentral()
    maven { url = 'https://mvn.wesjd.net/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
dependencies {
    implementation('net.wesjd:anvilgui:1.10.13-SNAPSHOT') { transitive = false }
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
jar { archiveBaseName = 'GEP' }

jar { archiveClassifier = "plain" }
shadowJar { archiveBaseName = "GEP"; archiveClassifier = ""; relocate "net.wesjd.anvilgui", "dev.gep.lib.anvilgui" }
